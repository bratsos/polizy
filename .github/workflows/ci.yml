name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        working-directory: packages/polizy

      - name: Lint
        run: pnpm biome check .

      - name: Type check
        run: pnpm tsc --noEmit
        working-directory: packages/polizy

      - name: Type check (tests + bench)
        run: pnpm tsc --noEmit -p tsconfig.tests.json
        working-directory: packages/polizy

      - name: Test
        run: pnpm test
        working-directory: packages/polizy
        env:
          NODE_ENV: test
          # The Prisma adapter suite runs against a real database. SQLite file DB,
          # created on the fly by `prisma db push`; the client is generated by the
          # package's `pretest` hook.
          DATABASE_URL: "file:./dev.db"

      - name: Build
        run: pnpm build
        working-directory: packages/polizy

  # Runs the Prisma adapter against Prisma 8 (@prisma/orm-postgres) on PostgreSQL.
  prisma8:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: polizy
          POSTGRES_PASSWORD: polizy
          POSTGRES_DB: polizy_prisma8_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POLIZY_TEST_POSTGRES_URL: "postgresql://polizy:polizy@localhost:5432/polizy_prisma8_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build polizy
        run: pnpm build
        working-directory: packages/polizy

      - name: Create the schema
        run: pnpm setup-db
        working-directory: packages/polizy-prisma8-tests

      - name: Type check
        run: pnpm typecheck
        working-directory: packages/polizy-prisma8-tests

      - name: Test
        run: pnpm test
        working-directory: packages/polizy-prisma8-tests
